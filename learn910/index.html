<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#184e48">
  <title>कक्षा 9–10 साथी</title>
  <style>
    :root{font-family:system-ui,'Noto Sans Devanagari',sans-serif;color:#193e39;background:#f8f6ef;font-size:16px}
    *{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #e8b851;outline-offset:2px}
    .shell{max-width:760px;min-height:100vh;margin:auto;padding-bottom:94px}.hero{background:#184e48;color:white;border-radius:0 0 30px 30px;padding:22px 20px 28px;position:relative;overflow:hidden}.hero:after{content:'✦';position:absolute;right:19px;top:-45px;font-size:160px;opacity:.07;pointer-events:none}.eyebrow{font-size:12px;letter-spacing:.07em;color:#bcdbd0;font-weight:800}.hero h1{font-size:28px;line-height:1.25;margin:9px 0 5px}.hero p{font-size:14px;line-height:1.55;color:#d5e8df;margin:0}.headrow{display:flex;align-items:center;gap:13px}.headrow h1{font-size:23px;margin:0}.back{width:42px;height:42px;border:0;border-radius:13px;background:#ffffff24;color:#fff;font-size:26px;flex:none}.grade-switch{display:flex;gap:8px;margin-top:21px;position:relative;z-index:1}.grade-switch button{border:1px solid #ffffff50;color:white;background:#ffffff16;border-radius:12px;padding:10px 17px;font-weight:700}.grade-switch button.active{background:#f6c568;color:#153f38;border-color:#f6c568}
    main{padding:19px}.intro{display:flex;align-items:center;gap:13px;border-radius:20px;background:#e7f0e8;border:1px solid #d5e6d7;padding:17px}.intro-icon{font-size:31px}.intro strong{font-size:18px}.intro p{font-size:13px;line-height:1.55;color:#567368;margin:4px 0 0}.section{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:26px 2px 12px}.section h2{font-size:19px;margin:0}.section span{font-size:13px;color:#6d8179}.summary{background:white;border:1px solid #e0e7de;border-radius:18px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:15px}.summary strong{font-size:25px}.summary p{margin:4px 0 0;color:#6e817a;font-size:13px}.ring{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#3a9983 var(--progress),#e4eee7 0);position:relative;font-size:13px;font-weight:800}.ring:before{content:'';position:absolute;inset:6px;border-radius:50%;background:white}.ring span{z-index:1}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{border:1px solid #e0e6dd;background:white;border-radius:19px;padding:16px;text-align:left;min-height:151px;box-shadow:0 4px 18px #183b3108}.card:active,.row:active{transform:scale(.99)}.icon{display:grid;place-items:center;width:46px;height:46px;background:var(--tint);color:var(--accent);border-radius:14px;font-size:23px;font-weight:800}.card strong{display:block;margin:13px 0 4px;font-size:16px;line-height:1.25}.card small,.row small{color:#6d8179;font-size:12px;line-height:1.4}.meter{height:6px;border-radius:8px;background:#e9ede7;overflow:hidden;margin-top:13px}.meter i{display:block;height:100%;background:var(--accent);border-radius:8px}.list{display:grid;gap:10px}.row{width:100%;border:1px solid #e0e6dd;background:white;border-radius:17px;padding:14px;display:flex;gap:13px;align-items:center;text-align:left}.num{width:42px;height:42px;display:grid;place-items:center;flex:none;background:var(--tint);color:var(--accent);border-radius:12px;font-weight:800}.row .detail{flex:1;min-width:0}.row strong{display:block;font-size:15px;margin-bottom:3px}.arrow{font-size:23px;color:#8b9b92}.done{color:#258b70;font-weight:800}
    .search{width:100%;padding:13px 15px;background:white;border:1px solid #dce3da;border-radius:13px;color:#193e39;margin:3px 0 0}.empty{text-align:center;color:#6d8179;padding:25px}.lesson-head{background:white;border:1px solid #e0e6dd;border-radius:20px;padding:19px}.badge{display:inline-block;border-radius:99px;background:var(--tint);color:var(--accent);font-size:12px;font-weight:800;padding:6px 11px}.lesson-head h2{font-size:24px;margin:14px 0 7px;line-height:1.3}.lesson-head p{margin:0;color:#536b61;line-height:1.65}.point{display:flex;gap:12px;align-items:flex-start;background:white;border:1px solid #e0e6dd;border-radius:15px;padding:14px 15px;line-height:1.65;margin-bottom:9px}.point b{color:#2c987c;flex:none}.activity{background:#e9f1e9;border:1px solid #d4e6d6;border-radius:19px;padding:17px;margin-top:24px}.activity h2{font-size:19px;margin:0 0 7px}.activity p{line-height:1.6;margin:0 0 13px}.answer{display:block;width:100%;text-align:left;border:1px solid #cadccf;background:white;border-radius:12px;padding:12px 14px;margin:8px 0;color:#193e39}.answer.correct{background:#dcf3e3;border-color:#38a66d}.answer.wrong{background:#fff0eb;border-color:#d7806b}.answer:disabled{opacity:1}.feedback{background:white;border-radius:12px;padding:12px;margin-top:11px;line-height:1.6;font-size:14px}.next{border:0;border-radius:12px;background:#184e48;color:white;padding:11px 16px;margin-top:11px;font-weight:800}.note{font-size:12px;color:#73877e;line-height:1.5;margin:19px 2px}.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:5px;border-top:1px solid #e2e7df;background:white;padding:9px 12px max(9px,env(safe-area-inset-bottom));z-index:4}.bottom button{min-width:90px;border:0;border-radius:12px;background:none;color:#6d8179;font-size:12px;padding:6px 15px}.bottom button.active{background:#e8f2e9;color:#176251;font-weight:800}.bottom span{display:block;font-size:20px;line-height:1.15;margin-bottom:3px}
    @media(max-width:350px){.grid{gap:8px}.card{padding:12px}.bottom button{min-width:75px;padding:6px 9px}}
  </style>
</head>
<body>
  <script>if('serviceWorker' in navigator)navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(()=>{})</script>
  <a href="../" style="position:fixed;top:10px;right:12px;z-index:9;background:#f6c568;color:#153f38;font:800 13px system-ui,sans-serif;text-decoration:none;padding:7px 12px;border-radius:99px;box-shadow:0 2px 8px #0003">⌂ सभी कक्षाएँ</a>
  <div id="app"></div>
  <script src="speak.js"></script>
  <script src="config.js"></script>
  <script src="content.js"></script>
  <script src="board10.js"></script>
  <script src="board10-more.js"></script>
  <script src="board.js"></script>
  <script>
    const app=document.getElementById('app');
    let grade=(g=>GRADES.includes(g)?g:GRADES[0])(Number(new URLSearchParams(location.search).get('grade'))),page='home',subjectId='',lessonIndex=0,query='';
    let progress={};
    try{progress=JSON.parse(localStorage.getItem('class910-progress')||'{}')||{}}catch(e){progress={}}
    const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const all=()=>courses[grade], selected=()=>all().find(s=>s.id===subjectId);
    const key=(s,i)=>grade+':'+s.id+':'+i;
    const count=s=>s.chapters.filter((_,i)=>progress[key(s,i)]).length;
    const total=()=>all().reduce((n,s)=>n+s.chapters.length,0);
    const finished=()=>all().reduce((n,s)=>n+count(s),0);
    const percent=()=>Math.round(finished()/total()*100);
    const style=s=>`--accent:${s.color};--tint:${s.color}20`;
    function head(title,description,back){return `<header class="hero">${back?`<div class="headrow"><button class="back" aria-label="वापस जाएँ" onclick="goBack()">‹</button><h1>${esc(title)}</h1></div>`:`<div class="eyebrow">सीखें • खेलें • आगे बढ़ें</div><h1>${esc(title)}</h1>`}<p>${esc(description)}</p>${!back&&GRADES.length>1?`<div class="grade-switch" aria-label="कक्षा चुनें">${GRADES.map(g=>`<button class="${grade===g?'active':''}" aria-pressed="${grade===g}" onclick="chooseGrade(${g})">कक्षा ${g}</button>`).join('')}</div>`:''}</header>`}
    function nav(active){return `<nav class="bottom" aria-label="मुख्य मेनू"><button class="${active==='home'?'active':''}" onclick="openHome()"><span>⌂</span>होम</button><button class="${active==='subjects'?'active':''}" onclick="openSubjects()"><span>▦</span>विषय</button><button class="${active==='progress'?'active':''}" onclick="openProgress()"><span>◴</span>प्रगति</button>${window.boardAvailable&&boardAvailable()?`<button class="${active==='board'?'active':''}" onclick="openBoard()"><span>📝</span>बोर्ड टेस्ट</button>`:''}</nav>`}
    function card(s){let n=count(s);return `<button class="card" style="${style(s)}" onclick="openSubject('${s.id}')"><span class="icon">${esc(s.icon)}</span><strong>${esc(s.name)}</strong><small>${esc(s.en)} · ${n}/${s.chapters.length} पूरे</small><div class="meter"><i style="width:${n/s.chapters.length*100}%"></i></div></button>`}
    function row(s,c,i){return `<button class="row" style="${style(s)}" onclick="openLesson('${s.id}',${i})"><span class="num">${String(i+1).padStart(2,'0')}</span><span class="detail"><strong>${esc(c.title)}</strong><small>${progress[key(s,i)]?'<span class="done">✓ पूरा किया</span>':'पाठ और एक सवाल'}</small></span><span class="arrow">›</span></button>`}
    function searchResults(){let q=query.trim().toLocaleLowerCase();if(!q)return `<div class="section"><h2>सभी विषय</h2><span>${all().length} विषय</span></div><div class="grid">${all().map(card).join('')}</div>`;let hits=all().flatMap(s=>s.chapters.map((c,i)=>({s,c,i}))).filter(x=>(x.s.name+' '+x.s.en+' '+x.c.title+' '+x.c.lead).toLocaleLowerCase().includes(q));return `<div class="section"><h2>खोज परिणाम</h2><span>${hits.length} पाठ</span></div><div class="list">${hits.map(x=>row(x.s,x.c,x.i)).join('')||'<div class="empty">कोई पाठ नहीं मिला। दूसरा शब्द लिखें।</div>'}</div>`}
    function render(){if(window.sayStop)sayStop();let html='';if(page==='home'){
      html=head(GRADES.length>1?'कक्षा 9–10 साथी':`कक्षा ${grade} साथी`,'आपकी कक्षा, आपके विषय, छोटे-छोटे पाठ।',false)+`<main><div class="intro"><span class="intro-icon">📚</span><div><strong>आज क्या सीखेंगे?</strong><p>विषय चुनें, पाठ पढ़ें और सवाल हल करें। सब कुछ बिना इंटरनेट चलता है।</p></div></div><div class="section"><h2>आपकी प्रगति</h2><span>कक्षा ${grade}</span></div><div class="summary"><div><strong>${finished()}/${total()}</strong><p>पाठ पूरे किए</p></div><div class="ring" style="--progress:${percent()}%"><span>${percent()}%</span></div></div><div class="section"><h2>विषय चुनें</h2><span>${all().length} विषय</span></div><div class="grid">${all().map(card).join('')}</div><p class="note">ये मुख्य अवधारणाओं के छोटे दोहराव पाठ हैं। बोर्ड परीक्षा की पूरी तैयारी के लिए अपनी पाठ्यपुस्तक ज़रूर पढ़ें।</p></main>`+nav('home');
    }else if(page==='subjects'){
      html=head(`कक्षा ${grade} के विषय`,'विषय चुनें या पाठ खोजें।',false)+`<main><input class="search" type="search" aria-label="पाठ खोजें" placeholder="पाठ खोजें..." value="${esc(query)}" oninput="search(this.value)"><div id="results">${searchResults()}</div></main>`+nav('subjects');
    }else if(page==='subject'){
      let s=selected();html=head(s.name,`कक्षा ${grade} · ${s.chapters.length} पाठ`,true)+`<main><div class="summary" style="${style(s)}"><div><strong>${count(s)}/${s.chapters.length}</strong><p>पाठ पूरे किए</p></div><span class="icon">${esc(s.icon)}</span></div><div class="section"><h2>पाठ</h2><span>पढ़ें और अभ्यास करें</span></div><div class="list">${s.chapters.map((c,i)=>row(s,c,i)).join('')}</div></main>`+nav('subjects');
    }else if(page==='lesson'){
      let s=selected(),c=s.chapters[lessonIndex];html=head(`पाठ ${lessonIndex+1}`,`${s.name} · कक्षा ${grade}`,true)+`<main style="${style(s)}"><article class="lesson-head"><span class="badge">${esc(s.name)}</span><h2>${esc(c.title)}</h2><p>${esc(c.lead)}</p>${window.sayBtn&&sayAvailable?sayBtn('lesson',[c.title,c.lead,...c.points].join('। ')):''}</article><div class="section"><h2>याद रखें</h2></div>${c.points.map(p=>`<div class="point"><b>✓</b><span>${esc(p)}</span></div>`).join('')}<section class="activity"><h2>अब आपकी बारी!</h2><p>${esc(c.q)}</p>${window.sayBtn&&sayAvailable?sayBtn('q',c.q+'। विकल्प: '+c.options.join(', ')):''}<div id="options">${c.options.map((o,i)=>`<button class="answer" onclick="answer(${i})">${esc(o)}</button>`).join('')}</div><div id="feedback" aria-live="polite"></div></section></main>`+nav('subjects');
    }else if(page==='progress'){
      html=head(`कक्षा ${grade} की प्रगति`,'सही उत्तर देकर पाठ पूरे करें।',false)+`<main><div class="summary"><div><strong>${finished()}/${total()}</strong><p>पाठ पूरे किए</p></div><div class="ring" style="--progress:${percent()}%"><span>${percent()}%</span></div></div><div class="section"><h2>विषय अनुसार</h2></div><div class="list">${all().map(s=>`<button class="row" style="${style(s)}" onclick="openSubject('${s.id}')"><span class="icon">${esc(s.icon)}</span><span class="detail"><strong>${esc(s.name)}</strong><small>${count(s)}/${s.chapters.length} पूरे</small><div class="meter"><i style="width:${count(s)/s.chapters.length*100}%"></i></div></span><span class="arrow">›</span></button>`).join('')}</div></main>`+nav('progress');
    }else if(page==='board'){html=renderBoardHome()+nav('board')
    }else if(page==='board-test'){html=renderBoardTest()
    }else if(page==='board-result'){html=renderBoardResult()+nav('board')
    }app.innerHTML=`<div class="shell">${html}</div>`;window.scrollTo(0,0)}
    function chooseGrade(n){if(window.boardStop)boardStop();grade=n;query='';page='home';render()}
    function search(value){query=value;document.getElementById('results').innerHTML=searchResults()}
    function openHome(){if(window.boardStop)boardStop();page='home';render()}function openSubjects(){if(window.boardStop)boardStop();page='subjects';render()}function openProgress(){if(window.boardStop)boardStop();page='progress';render()}
    function openSubject(id){subjectId=id;page='subject';render()}function openLesson(id,i){subjectId=id;lessonIndex=i;page='lesson';render()}
    function answer(i){let s=selected(),c=s.chapters[lessonIndex],buttons=document.querySelectorAll('#options button');buttons.forEach((b,n)=>{b.disabled=true;if(n===c.answer)b.classList.add('correct');else if(n===i)b.classList.add('wrong')});let good=i===c.answer;document.getElementById('feedback').innerHTML=`<div class="feedback"><strong>${good?'बहुत बढ़िया! सही जवाब 🎉':'एक बार फिर कोशिश करें'}</strong><br>${esc(c.why)}<br>${good?`<button class="next" onclick="nextLesson()">${lessonIndex<s.chapters.length-1?'अगला पाठ':'विषय पर लौटें'} ›</button>`:'<button class="next" onclick="retry()">फिर से जवाब दें</button>'}</div>`;if(good){progress[key(s,lessonIndex)]=true;try{localStorage.setItem('class910-progress',JSON.stringify(progress))}catch(e){}}}
    function retry(){let c=selected().chapters[lessonIndex];document.getElementById('options').innerHTML=c.options.map((o,i)=>`<button class="answer" onclick="answer(${i})">${esc(o)}</button>`).join('');document.getElementById('feedback').innerHTML=''}
    function nextLesson(){let s=selected();if(lessonIndex<s.chapters.length-1){lessonIndex++;render()}else{page='subject';render()}}
    function goBack(){if(page==='board-test'){if(confirm('टेस्ट छोड़कर बाहर जाएँ? उत्तर सेव नहीं होंगे।'))openBoard();return true}if(page==='board-result'){openBoard();return true}if(page==='lesson'){page='subject';render();return true}if(page==='subject'){page='subjects';render();return true}if(page!=='home'){page='home';render();return true}return false}
    render();
  </script>
</body>
</html>
