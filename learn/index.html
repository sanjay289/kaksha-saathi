<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#184e48">
  <title>बिहार कक्षा साथी</title>
  <style>
    :root{font:16px system-ui,'Noto Sans Devanagari',sans-serif;color:#193e39;background:#f8f6ef}
    *{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #e8b851;outline-offset:2px}
    .shell{max-width:780px;min-height:100vh;margin:auto;padding-bottom:88px}.hero{background:#184e48;color:white;border-radius:0 0 29px 29px;padding:23px 20px 28px;position:relative;overflow:hidden}.hero:after{content:'✦';position:absolute;right:12px;top:-43px;font-size:160px;opacity:.07;pointer-events:none}.eyebrow{font-size:12px;letter-spacing:.07em;color:#b9dacb;font-weight:800}.hero h1{font-size:28px;margin:10px 0 6px;line-height:1.22}.hero p{font-size:14px;color:#d5e8df;margin:0;line-height:1.55}.headrow{display:flex;gap:12px;align-items:center}.headrow h1{font-size:22px;margin:0}.back{width:42px;height:42px;flex:none;border:0;border-radius:12px;background:#ffffff24;color:white;font-size:25px}
    main{padding:19px}.intro{display:flex;align-items:center;gap:13px;background:#e6f0e8;border:1px solid #d1e4d6;border-radius:19px;padding:17px}.intro .art{font-size:31px}.intro strong{font-size:18px}.intro p{margin:4px 0 0;font-size:13px;line-height:1.55;color:#587467}.section{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:26px 2px 12px}.section h2{font-size:19px;margin:0}.section span{font-size:13px;color:#70847b}.summary{background:#fff;border:1px solid #e0e7df;border-radius:18px;padding:17px;display:flex;justify-content:space-between;align-items:center}.summary strong{font-size:26px}.summary p{font-size:13px;color:#71847b;margin:3px 0 0}.ring{width:58px;height:58px;border-radius:50%;background:conic-gradient(#37927c var(--progress),#e5eee8 0);display:grid;place-items:center;position:relative;font-size:13px;font-weight:800}.ring:before{content:'';position:absolute;inset:6px;background:#fff;border-radius:50%}.ring span{z-index:1}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{background:#fff;border:1px solid #e0e6dd;border-radius:19px;padding:16px;min-height:159px;text-align:left;color:#193e39;box-shadow:0 4px 16px #143d3107}.card:active,.row:active{transform:scale(.99)}.icon{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--tint);color:var(--accent);font-size:23px;font-weight:800}.card strong{display:block;margin:12px 0 3px;font-size:16px}.card small{display:block;color:#71847b;font-size:12px;line-height:1.45}.book{font-size:11px;color:#789087;margin-top:3px;line-height:1.35}.meter{height:6px;border-radius:8px;background:#e7ece6;overflow:hidden;margin-top:12px}.meter i{display:block;height:100%;background:var(--accent);border-radius:8px}.search{width:100%;border:1px solid #dbe3da;border-radius:13px;background:#fff;color:#193e39;padding:13px 15px}.list{display:grid;gap:10px}.row{width:100%;display:flex;gap:13px;align-items:center;text-align:left;background:#fff;border:1px solid #e0e6dd;border-radius:16px;padding:14px;color:#193e39}.num{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:12px;background:var(--tint);color:var(--accent);font-weight:800}.detail{flex:1;min-width:0}.row strong{display:block;font-size:15px}.row small{display:block;margin-top:3px;color:#71847b;font-size:12px;line-height:1.4}.arrow{font-size:23px;color:#8b9c92}.done{color:#238569;font-weight:800}.empty{padding:26px;text-align:center;color:#71847b}
    .lesson-head{background:#fff;border:1px solid #e0e6dd;border-radius:20px;padding:19px}.badge{display:inline-block;background:var(--tint);color:var(--accent);font-size:12px;font-weight:800;border-radius:99px;padding:6px 11px}.lesson-head h2{font-size:24px;line-height:1.3;margin:14px 0 7px}.lesson-head p{margin:0;color:#536e63;line-height:1.65}.point{display:flex;gap:11px;align-items:flex-start;background:#fff;border:1px solid #e0e6dd;border-radius:14px;padding:14px;margin-bottom:9px;line-height:1.65}.point b{color:#2c977a;flex:none}.wordgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.word{background:#fff;border:1px solid #e0e6dd;border-radius:13px;padding:11px}.word strong{display:block}.word span{color:#70847b;font-size:13px}.task{background:#fff7e8;border:1px solid #efdfbf;border-radius:14px;padding:15px;line-height:1.6}.task strong{display:block;margin-bottom:4px}.quiz{background:#e9f1e9;border:1px solid #d5e6d7;border-radius:19px;padding:17px}.quiz h2{font-size:19px;margin:0 0 6px}.quiz>p{font-size:13px;color:#647c6e;margin:0 0 12px;line-height:1.5}.question{background:#fff;border:1px solid #d9e5db;border-radius:14px;padding:13px;margin-top:10px}.question>strong{display:block;line-height:1.55;margin-bottom:8px}.option{display:block;text-align:left;width:100%;border:1px solid #d2dfd4;border-radius:11px;background:#fff;color:#193e39;padding:11px 12px;margin-top:7px}.option.correct{border-color:#36a56a;background:#e1f4e7}.option.wrong{border-color:#d4806e;background:#fff0ea}.option:disabled{opacity:1}.feedback{font-size:13px;line-height:1.5;margin-top:9px;color:#546b5d}.success{color:#1d805d;font-weight:800}.next{border:0;border-radius:12px;background:#184e48;color:#fff;font-weight:800;padding:12px 16px;margin-top:13px}.note{font-size:12px;line-height:1.6;color:#71847b;margin:18px 2px}.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:6px;background:#fff;border-top:1px solid #e0e6dd;padding:9px 12px max(9px,env(safe-area-inset-bottom));z-index:5}.bottom button{border:0;border-radius:12px;background:none;color:#71847b;min-width:90px;font-size:12px;padding:6px 14px}.bottom button.active{background:#e7f2e9;color:#176451;font-weight:800}.bottom span{font-size:20px;display:block;line-height:1.15;margin-bottom:3px}
    @media(max-width:370px){.card{padding:12px}.wordgrid{grid-template-columns:1fr}.bottom button{min-width:78px;padding:6px 9px}}
  </style>
</head>
<body>
  <script>if('serviceWorker' in navigator)navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(()=>{})</script>
  <a href="../" style="position:fixed;top:10px;right:12px;z-index:9;background:#f6c568;color:#153f38;font:800 13px system-ui,sans-serif;text-decoration:none;padding:7px 12px;border-radius:99px;box-shadow:0 2px 8px #0003">⌂ सभी कक्षाएँ</a>
  <div id="app"></div>
  <script src="speak.js"></script>
  <script src="primary.js"></script>
  <script src="class8-core.js"></script>
  <script src="class8-english.js"></script>
  <script src="grades3-5.js"></script>
  <script src="grades6-8.js"></script>
  <script src="more-lessons-primary.js"></script>
  <script src="more-lessons-upper.js"></script>
  <script>
    const app=document.getElementById('app');
    const parsedGrade=Number(new URLSearchParams(location.search).get('grade'));
    const grade=Number.isInteger(parsedGrade)&&parsedGrade>=1&&parsedGrade<=8?parsedGrade:1;
    const items=courses[grade];
    let page='home',subjectId='',lessonIndex=0,query='',quizState={};
    let progress={};
    try{progress=JSON.parse(localStorage.getItem('bihar-class-'+grade+'-progress')||'{}')||{}}catch(e){progress={}}
    const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const selected=()=>items.find(s=>s.id===subjectId);
    const key=(s,i)=>s.id+':'+i;
    const count=s=>s.chapters.filter((_,i)=>progress[key(s,i)]).length;
    const total=()=>items.reduce((n,s)=>n+s.chapters.length,0);
    const finished=()=>items.reduce((n,s)=>n+count(s),0);
    const percent=()=>Math.round(finished()/total()*100);
    const style=s=>`--accent:${s.color};--tint:${s.color}20`;
    const questions=c=>c.quiz||[{question:c.q,options:c.options,answer:c.answer,explanation:c.why}];
    function head(title,sub,back){return `<header class="hero">${back?`<div class="headrow"><button class="back" aria-label="वापस जाएँ" onclick="goBack()">‹</button><h1>${esc(title)}</h1></div>`:`<div class="eyebrow">बिहार · कक्षा ${grade} · अध्ययन साथी</div><h1>${esc(title)}</h1>`}<p>${esc(sub)}</p></header>`}
    function nav(active){return `<nav class="bottom" aria-label="मुख्य मेनू"><button class="${active==='home'?'active':''}" onclick="openHome()"><span>⌂</span>होम</button><button class="${active==='subjects'?'active':''}" onclick="openSubjects()"><span>▦</span>विषय</button><button class="${active==='progress'?'active':''}" onclick="openProgress()"><span>◴</span>प्रगति</button></nav>`}
    function card(s){let n=count(s);return `<button class="card" style="${style(s)}" onclick="openSubject('${s.id}')"><span class="icon">${esc(s.icon)}</span><strong>${esc(s.name)}</strong><small>${esc(s.en)} · ${n}/${s.chapters.length} पूरे</small><div class="book">${esc(s.book||'मूल अभ्यास')}</div><div class="meter"><i style="width:${n/s.chapters.length*100}%"></i></div></button>`}
    function row(s,c,i){return `<button class="row" style="${style(s)}" onclick="openLesson('${s.id}',${i})"><span class="num">${String(i+1).padStart(2,'0')}</span><span class="detail"><strong>${esc(c.title)}</strong><small>${progress[key(s,i)]?'<span class="done">✓ पूरा किया</span>':'पढ़ें और अभ्यास करें'}</small></span><span class="arrow">›</span></button>`}
    function results(){let q=query.trim().toLocaleLowerCase();if(!q)return `<div class="section"><h2>सभी विषय</h2><span>${items.length} विषय</span></div><div class="grid">${items.map(card).join('')}</div>`;let found=items.flatMap(s=>s.chapters.map((c,i)=>({s,c,i}))).filter(x=>(x.s.name+' '+x.s.en+' '+x.c.title+' '+x.c.lead).toLocaleLowerCase().includes(q));return `<div class="section"><h2>खोज परिणाम</h2><span>${found.length} पाठ</span></div><div class="list">${found.map(x=>row(x.s,x.c,x.i)).join('')||'<div class="empty">कोई पाठ नहीं मिला। दूसरा शब्द लिखें।</div>'}</div>`}
    function render(){if(window.sayStop)sayStop();let html='';if(page==='home'){
      html=head(`कक्षा ${grade} साथी`,'सभी मुख्य विषयों में छोटे पाठ और अभ्यास।',false)+`<main><div class="intro"><span class="art">📚</span><div><strong>आज कुछ नया सीखें</strong><p>विषय चुनें, बात समझें और सवाल का जवाब दें। इंटरनेट की ज़रूरत नहीं।</p></div></div><div class="section"><h2>आपकी प्रगति</h2><span>${finished()}/${total()} पाठ</span></div><div class="summary"><div><strong>${percent()}%</strong><p>कुल प्रगति</p></div><div class="ring" style="--progress:${percent()}%"><span>${finished()}/${total()}</span></div></div><div class="section"><h2>विषय चुनें</h2><span>${items.length} विषय</span></div><div class="grid">${items.map(card).join('')}</div><p class="note">यह हिंदी-माध्यम के मुख्य विषयों के लिए मौलिक अभ्यास सामग्री है। पूरे पाठ और विद्यालय के अभ्यास के लिए अपनी पाठ्यपुस्तक भी पढ़ें।</p></main>`+nav('home');
    }else if(page==='subjects'){
      html=head(`कक्षा ${grade} के विषय`,'पाठ खोजें या कोई विषय चुनें।',false)+`<main><input class="search" type="search" aria-label="पाठ खोजें" placeholder="पाठ खोजें..." value="${esc(query)}" oninput="search(this.value)"><div id="results">${results()}</div></main>`+nav('subjects');
    }else if(page==='subject'){
      let s=selected();html=head(s.name,`${s.book||s.en} · ${s.chapters.length} पाठ`,true)+`<main><div class="summary" style="${style(s)}"><div><strong>${count(s)}/${s.chapters.length}</strong><p>पाठ पूरे किए</p></div><span class="icon">${esc(s.icon)}</span></div><div class="section"><h2>पाठ</h2><span>पढ़ें और अभ्यास करें</span></div><div class="list">${s.chapters.map((c,i)=>row(s,c,i)).join('')}</div></main>`+nav('subjects');
    }else if(page==='lesson'){
      let s=selected(),c=s.chapters[lessonIndex];html=head(`पाठ ${lessonIndex+1}`,`${s.name} · कक्षा ${grade}`,true)+`<main style="${style(s)}"><article class="lesson-head"><span class="badge">${esc(s.name)}</span><h2>${esc(c.title)}</h2><p>${esc(c.lead)}</p>${window.sayBtn&&sayAvailable?sayBtn('lesson',[c.title,c.lead,...c.points,...(c.words||[]).map(w=>w[0]+', '+w[1]),c.task||''].join('। ')):''}</article><div class="section"><h2>मुख्य बातें</h2></div>${c.points.map(p=>`<div class="point"><b>✓</b><span>${esc(p)}</span></div>`).join('')}${c.words?`<div class="section"><h2>शब्दार्थ</h2></div><div class="wordgrid">${c.words.map(w=>`<div class="word"><strong>${esc(w[0])}</strong><span>${esc(w[1])}</span></div>`).join('')}</div>`:''}${c.task?`<div class="section"><h2>खुद करें</h2></div><div class="task"><strong>अभ्यास</strong>${esc(c.task)}</div>`:''}<div class="section"><h2>समझ जाँचें</h2><span>${questions(c).length} सवाल</span></div><section class="quiz"><h2>अब आपकी बारी</h2><p>सभी सवालों का सही जवाब देकर पाठ पूरा करें।</p><div id="quiz-questions"></div><div id="quiz-complete" aria-live="polite"></div></section></main>`+nav('subjects');
    }else if(page==='progress'){
      html=head('मेरी प्रगति',`कक्षा ${grade} के पाठ`,false)+`<main><div class="summary"><div><strong>${finished()}/${total()}</strong><p>पाठ पूरे किए</p></div><div class="ring" style="--progress:${percent()}%"><span>${percent()}%</span></div></div><div class="section"><h2>विषय अनुसार</h2></div><div class="list">${items.map(s=>`<button class="row" style="${style(s)}" onclick="openSubject('${s.id}')"><span class="icon">${esc(s.icon)}</span><span class="detail"><strong>${esc(s.name)}</strong><small>${count(s)}/${s.chapters.length} पाठ पूरे</small><div class="meter"><i style="width:${count(s)/s.chapters.length*100}%"></i></div></span><span class="arrow">›</span></button>`).join('')}</div></main>`+nav('progress');
    }app.innerHTML=`<div class="shell">${html}</div>`;if(page==='lesson')renderQuiz();window.scrollTo(0,0)}
    function renderQuiz(){let c=selected().chapters[lessonIndex],qs=questions(c);document.getElementById('quiz-questions').innerHTML=qs.map((q,i)=>{let state=quizState[i]||{};return `<div class="question"><strong>${i+1}. ${esc(q.question)}</strong>${window.sayBtn&&sayAvailable?sayBtn('q'+i,q.question+'। विकल्प: '+q.options.join(', ')):''}${q.options.map((o,n)=>`<button class="option ${state.chosen===n?(state.correct?'correct':'wrong'):''}" ${state.correct?'disabled':''} onclick="answer(${i},${n})">${esc(o)}</button>`).join('')}${state.chosen!==undefined?`<div class="feedback ${state.correct?'success':''}">${state.correct?'सही जवाब!':'फिर कोशिश करें। '}${esc(q.explanation)}</div>`:''}</div>`}).join('');let done=qs.every((_,i)=>quizState[i]&&quizState[i].correct);document.getElementById('quiz-complete').innerHTML=done?`<div class="feedback success">पाठ पूरा हुआ! शाबाश 🎉</div><button class="next" onclick="nextLesson()">${lessonIndex<selected().chapters.length-1?'अगला पाठ':'विषय पर लौटें'} ›</button>`:'';if(done&&!progress[key(selected(),lessonIndex)]){progress[key(selected(),lessonIndex)]=true;try{localStorage.setItem('bihar-class-'+grade+'-progress',JSON.stringify(progress))}catch(e){}}}
    function answer(i,n){let q=questions(selected().chapters[lessonIndex])[i];if(quizState[i]&&quizState[i].correct)return;quizState[i]={chosen:n,correct:n===q.answer};renderQuiz();if(window.sayRefresh)sayRefresh()}
    function search(v){query=v;document.getElementById('results').innerHTML=results()}
    function openHome(){page='home';render()}function openSubjects(){page='subjects';render()}function openProgress(){page='progress';render()}
    function openSubject(id){subjectId=id;page='subject';render()}function openLesson(id,i){subjectId=id;lessonIndex=i;quizState={};page='lesson';render()}
    function nextLesson(){if(lessonIndex<selected().chapters.length-1)openLesson(subjectId,lessonIndex+1);else{page='subject';render()}}
    function goBack(){if(page==='lesson'){page='subject';render();return true}if(page==='subject'){page='subjects';render();return true}if(page!=='home'){page='home';render();return true}return false}
    render();
  </script>
</body>
</html>
